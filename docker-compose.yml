services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: produtos-app-sqlserver

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Coti@2026"

    ports:
      - "1434:1433"

    volumes:
      - produtos-app-sqlserver-data:/var/opt/mssql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Coti@2026' -C -Q 'SELECT 1' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    restart: unless-stopped


  adminer:
    image: adminer:latest
    container_name: produtos-app-adminer

    environment:
      ADMINER_DEFAULT_SERVER: sqlserver
      ADMINER_DESIGN: nette

    ports:
      - "5052:8080"

    depends_on:
      sqlserver:
        condition: service_healthy

    restart: unless-stopped


volumes:
  produtos-app-sqlserver-data: